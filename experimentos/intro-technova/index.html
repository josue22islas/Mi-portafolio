            <title id="logo-title">Technova Solutions</title>
            <desc id="logo-description">
              Logotipo de Technova Solutions con emblema circular de puntos dorados,
              palabra Technova blanca, palabra Solutions azul y línea dorada.
            </desc>
          
            <style>
              svg.brand-svg {
                color-scheme: dark;
                background: transparent;
                --logo-bg: #0d1116;
                --logo-gold: #fec107;
                --logo-gold-warm: #ffb20f;
                --logo-white: #ffffff;
                --logo-blue: #004aad;
              }
          
              .logo-dot,
              .logo-letter,
              .logo-accent {
                vector-effect: non-scaling-stroke;
              }
          
              .logo-dot {
                fill: var(--logo-gold);
                transform-box: fill-box;
                transform-origin: center;
              }
          
              .logo-dot--minor {
                fill: var(--logo-gold-warm);
                opacity: 0.82;
              }
          
              .logo-dot--micro {
                fill: var(--logo-gold-warm);
                opacity: 0.28;
              }
          
              .logo-letter--mark,
              .logo-letter--name {
                fill: var(--logo-white);
              }
          
              .logo-letter--service {
                fill: var(--logo-blue);
              }
          
              .logo-accent {
                fill: none;
                stroke: var(--logo-gold);
                stroke-linecap: butt;
                stroke-linejoin: round;
                stroke-width: 5.5;
              }
          
              #technova-solutions-logo.is-animated .logo-dot {
                animation: dot-arrival 760ms cubic-bezier(0.16, 1, 0.3, 1) both;
                animation-delay: calc(var(--dot-index, 0) * 10ms);
              }
          
              #technova-solutions-logo.is-animated .logo-accent {
                stroke-dasharray: 670;
                stroke-dashoffset: 670;
                animation: draw-accent 1.05s 430ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
              }
          
              #technova-solutions-logo.is-animated .logo-letter {
                opacity: 0;
                transform: translateY(8px);
                animation: word-arrival 700ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
              }
          
              #technova-solutions-logo.is-animated .logo-letter--mark {
                animation-delay: 420ms;
              }
          
              #technova-solutions-logo.is-animated .logo-letter--name {
                animation-delay: 520ms;
              }
          
              #technova-solutions-logo.is-animated .logo-letter--service {
                animation-delay: 650ms;
              }
          
              @keyframes dot-arrival {
                from { opacity: 0; transform: scale(0); }
                to { transform: scale(1); }
              }
          
              @keyframes draw-accent {
                to { stroke-dashoffset: 0; }
              }
          
              @keyframes word-arrival {
                to { opacity: 1; transform: translateY(0); }
              }
          
              @media (prefers-reduced-motion: reduce) {
                #technova-solutions-logo.is-animated .logo-dot,
                #technova-solutions-logo.is-animated .logo-letter,
                #technova-solutions-logo.is-animated .logo-accent {
                  animation: none;
                  opacity: 1;
                  stroke-dashoffset: 0;
                  transform: none;
                }
              }
            </style>
